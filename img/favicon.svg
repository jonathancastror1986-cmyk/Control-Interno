<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Ícono de la app. Es SVG y no un .ico a propósito: el navegador lo
    pide solo en cada pestaña, y sin él la consola se llenaba de
    "Failed to load resource: 404 favicon.ico", que tapaba los errores
    de verdad. Una línea de <link> lo evita sin agregar un archivo binario.
  -->
  <rect width="64" height="64" rx="14" fill="#0f2b23"/>
  <rect x="16" y="14" width="32" height="36" rx="5" fill="#f2ede4"/>
  <rect x="16" y="14" width="32" height="10" rx="5" fill="#c9a227"/>
  <rect x="22" y="29" width="12" height="3.2" rx="1.6" fill="#0f2b23"/>
  <rect x="22" y="36" width="20" height="3.2" rx="1.6" fill="#8a8a80"/>
  <rect x="22" y="43" width="15" height="3.2" rx="1.6" fill="#8a8a80"/>
  <circle cx="45" cy="47" r="9" fill="#1d6f52" stroke="#f2ede4" stroke-width="2.5"/>
  <path d="M41 47.2l2.8 2.9 5.2-5.6" fill="none" stroke="#f2ede4" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
