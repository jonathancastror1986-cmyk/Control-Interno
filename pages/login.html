<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Control de Asistencia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseConfig.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);font-family:'Montserrat',system-ui,sans-serif}
.loginCard{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.loginBrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.loginBrand .icon{width:36px;height:36px;border-radius:9px;background:var(--accent2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.loginCard h1{font-size:1.3rem;margin:6px 0 2px}
.loginCard p.sub{color:var(--muted);margin:0 0 18px;font-size:.9rem}
.loginErr{color:var(--danger);font-size:.85rem;margin-top:8px;display:none}
.loginFoot{margin-top:16px;font-size:.8rem;color:var(--muted);text-align:center}
</style>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="loginCard">
  <div class="login-theme-toggle"><button type="button" class="btn secondary theme-toggle" data-theme-toggle></button></div>
  <div class="loginBrand">
    <div class="icon" id="brandIcon">🪪</div>
    <div id="brandName">Control de Asistencia</div>
  </div>
  <h1>Inicia sesión</h1>
  <p class="sub">Entra a tu panel de portería, bodega y asistencia.</p>
  <label>Correo</label>
  <input type="email" id="email" autocomplete="username">
  <label style="margin-top:10px">Contraseña</label>
  <input type="password" id="password" autocomplete="current-password">
  <div class="loginErr" id="loginErr">No se pudo iniciar sesión: revisa tu correo y contraseña.</div>
  <button class="btn" style="width:100%;margin-top:16px" onclick="doLogin()">Iniciar sesión</button>
  <div class="loginFoot">¿Aún no tienes acceso? Pide una invitación a quien administra el sistema.</div>
</div>
<script>
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('loginErr');
  err.style.display='none';
  if(!email||!password){err.textContent='Ingresa tu correo y contraseña.';err.style.display='block';return;}
  const { error } = await window.supabaseClient.auth.signInWithPassword({email,password});
  if(error){
    err.textContent='No se pudo iniciar sesión: revisa tu correo y contraseña.';
    err.style.display='block';
    return;
  }
  window.location.href='app.html';
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// si ya hay sesión activa, saltar directo a la app
window.supabaseClient.auth.getSession().then(({data:{session}})=>{
  if(session) window.location.href='app.html';
});
</script>
</body>
</html>
