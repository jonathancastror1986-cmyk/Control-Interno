<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Control de Asistencia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseConfig.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);font-family:'Montserrat',system-ui,sans-serif}
.loginCard{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.loginBrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.loginBrand .icon{width:36px;height:36px;border-radius:9px;background:var(--accent2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.loginCard h1{font-size:1.3rem;margin:6px 0 2px}
.loginCard p.sub{color:var(--muted);margin:0 0 18px;font-size:.9rem}
.loginErr{color:var(--danger);font-size:.85rem;margin-top:8px;display:none}
.loginFoot{margin-top:16px;font-size:.8rem;color:var(--muted);text-align:center}
.loginBox{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.loginBox .loginHint{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.loginOk{color:var(--accent);font-size:.85rem;margin-top:8px;display:none}
</style>
<link rel="stylesheet" href="../css/_tokens.css?v=1">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="loginCard">
  <div class="login-theme-toggle"><button type="button" class="btn secondary theme-toggle" data-theme-toggle></button></div>
  <div class="loginBrand">
    <div class="icon" id="brandIcon">🪪</div>
    <div id="brandName">Control de Asistencia</div>
  </div>
  <h1>Inicia sesión</h1>
  <p class="sub">Entra a tu panel de portería, bodega y asistencia.</p>
  <label>Correo</label>
  <input type="email" id="email" autocomplete="username">
  <label style="margin-top:10px">Contraseña</label>
  <input type="password" id="password" autocomplete="current-password">
  <div class="loginErr" id="loginErr">No se pudo iniciar sesión: revisa tu correo y contraseña.</div>
  <button class="btn" style="width:100%;margin-top:16px" onclick="doLogin()">Iniciar sesión</button>
  <button class="btn secondary" style="width:100%;margin-top:8px" onclick="olvidePassword()">Olvidé mi contraseña</button>

  <div class="loginBox" id="resetBox">
    <p class="loginHint">Te mandamos un enlace al correo para que pongas una contraseña nueva.</p>
    <label for="resetCorreo">Correo</label>
    <input type="email" id="resetCorreo" autocomplete="username">
    <button class="btn" style="width:100%;margin-top:10px" id="btnReset" onclick="enviarRecuperacion()">Enviar enlace</button>
    <div class="loginOk" id="resetOk"></div>
    <div class="loginErr" id="resetErr"></div>
  </div>

  <div class="loginFoot" id="loginFoot">¿Aún no tienes acceso? Pide una invitación a quien administra el sistema.</div>
</div>
<script>
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('loginErr');
  err.style.display='none';
  if(!email||!password){err.textContent='Ingresa tu correo y contraseña.';err.style.display='block';return;}
  const { error } = await window.supabaseClient.auth.signInWithPassword({email,password});
  if(error){
    err.textContent='No se pudo iniciar sesión: revisa tu correo y contraseña.';
    err.style.display='block';
    return;
  }
  window.location.href='app.html';
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ---------- recuperar contraseña ----------
// El correo lo manda la Edge Function "recuperar", que es la única que
// puede indicar a qué dirección vuelve el enlace. Desde el navegador
// con la anon key, Supabase lo devolvería a su "Site URL" (localhost en
// la mayoría de los proyectos) y el enlace no abriría.
let resetAbierto=false;
function olvidePassword(){
  const box=document.getElementById('resetBox');
  // El estado va en una variable y no leyendo style.display: al abrir la
  // página el recuadlo está oculto por el CSS, sin estilo en línea, y
  // comparar contra '' hacía que el botón no lo abriera nunca.
  resetAbierto=!resetAbierto;
  // 'block' explícito y no cadena vacía: al vaciarlo vuelve el CSS, que
  // lo tiene en display:none, y el botón no abriría nada.
  box.style.display=resetAbierto?'block':'none';
  document.getElementById('loginErr').style.display='none';
  if(resetAbierto&&!document.getElementById('resetCorreo').value)document.getElementById('resetCorreo').focus();
}
async function enviarRecuperacion(){
  const correo=document.getElementById('resetCorreo').value.trim().toLowerCase();
  const ok=document.getElementById('resetOk');
  const err=document.getElementById('resetErr');
  const btn=document.getElementById('btnReset');
  ok.style.display='none';err.style.display='none';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)){
    err.textContent='Escribe un correo válido.';err.style.display='block';return;
  }
  btn.disabled=true;btn.textContent='Enviando…';
  try{
    const {data,error}=await window.supabaseClient.functions.invoke('recuperar',{body:{correo}});
    if(error){
      // supabase-js reporta "Failed to send a request to the Edge
      // Function" cuando la función no existe: la URL devuelve la
      // página de error del panel en vez de JSON y no lo puede parsear.
      // Mostrar ese texto tal cual no le dice nada a quien lo lee.
      const texto=String(error.message||error);
      if(/Invalid JWT|JWT|session|401|unauthor/i.test(texto)){
        err.textContent='Tu sesión caducó. Vuelve a iniciar sesión e inténtalo de nuevo.';
      }else if(/Failed to fetch|Network|Failed to send a request|not found|404|does not exist|non-2xx/i.test(texto)){
        err.textContent='La función "recuperar" no está desplegada todavía. En la terminal, dentro del proyecto: supabase functions deploy recuperar. Mientras tanto, pídele a un administrador que te reinicie la contraseña.';
      }else{
        err.textContent='No se pudo enviar: '+texto;
      }
      return;
    }
    if(data&&data.error){err.textContent=data.error;err.style.display='block';return;}
    // El mismo texto exista o no la cuenta: decir "ese correo no existe"
    // serviría para averiguar quién trabaja en la obra.
    ok.textContent=(data&&data.mensaje)||'Si ese correo tiene una cuenta, te mandamos el enlace.';
    ok.style.display='block';
    document.getElementById('resetCorreo').value='';
  }catch(e){
    err.textContent='No se pudo enviar: '+((e&&e.message)||e);
    err.style.display='block';
  }finally{
    btn.disabled=false;btn.textContent='Enviar enlace';
  }
}
document.getElementById('resetCorreo').addEventListener('keydown',e=>{if(e.key==='Enter')enviarRecuperacion();});

// si ya hay sesión activa, saltar directo a la app
window.supabaseClient.auth.getSession().then(({data:{session}})=>{
  if(session) window.location.href='app.html';
});
</script>
</body>
</html>
