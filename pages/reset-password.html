<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar mi contraseña — Control de Asistencia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseConfig.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);font-family:'Montserrat',system-ui,sans-serif;padding:16px}
.regCard{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.regBrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.regBrand .icon{width:36px;height:36px;border-radius:9px;background:var(--accent2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.regCard h1{font-size:1.3rem;margin:6px 0 2px}
.regCard p.sub{color:var(--muted);margin:0 0 18px;font-size:.9rem}
.regMsg{font-size:.85rem;margin-top:12px;padding:9px 11px;border-radius:8px;display:none;line-height:1.45}
.regMsg.ok{display:block;background:rgba(46,125,50,.1);border:1px solid var(--accent);color:var(--accent)}
.regMsg.err{display:block;background:rgba(198,40,40,.1);border:1px solid var(--danger);color:var(--danger)}
.regMsg.warn{display:block;background:rgba(224,139,26,.12);border:1px solid #e08b1a;color:#8a5a00}
.regFoot{margin-top:16px;font-size:.8rem;color:var(--muted);text-align:center}
.pwdWrap{position:relative}
.pwdWrap input{width:100%;padding-right:62px}
.pwdToggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:.7rem;color:var(--muted);padding:4px 6px}
</style>
</head>
<body>
<div class="regCard">
  <div class="login-theme-toggle"><button type="button" class="btn secondary theme-toggle" data-theme-toggle></button></div>
  <div class="regBrand">
    <div class="icon">🪪</div>
    <div id="brandName">Control de Asistencia</div>
  </div>
  <h1 id="titulo">Cambia tu contraseña</h1>
  <p class="sub" id="bajada">Escribe la nueva contraseña y listo.</p>

  <form id="formPwd" autocomplete="off" style="display:none">
    <label for="password">Contraseña nueva</label>
    <div class="pwdWrap">
      <input type="password" id="password" autocomplete="new-password" required>
      <button type="button" class="pwdToggle" data-ver>Ver</button>
    </div>

    <label for="password2" style="margin-top:12px">Repite la contraseña</label>
    <div class="pwdWrap">
      <input type="password" id="password2" autocomplete="new-password" required>
      <button type="button" class="pwdToggle" data-ver>Ver</button>
    </div>

    <div style="height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden">
      <div id="barra" style="height:100%;width:0;transition:width .2s,background .2s"></div>
    </div>
    <small id="fuerzaTxt" style="color:var(--muted);font-size:.75rem;margin-top:4px;display:block">Mínimo 8 caracteres.</small>

    <button class="btn" style="width:100%;margin-top:16px" id="btnGuardar">Guardar contraseña</button>
  </form>

  <div id="msg" class="regMsg" role="status" aria-live="polite"></div>

  <div class="regFoot"><a href="login.html">Volver a iniciar sesión</a></div>
</div>

<script>
// ------------------------------------------------------------------
// Cambiar la contraseña.
//
// El enlace que manda Supabase trae un token. Con el flujo nuevo
// (detectCodeExchangeInUrl) llega como ?code=... en la URL; con el
// antiguo, dentro del fragmento (#access_token=...). Se aceptan los
// dos para que un enlace generado antes de cambiar la configuración
// siga sirviendo.
//
// Lo importante: al guardar NO se navega a otra página. Se guarda la
// contraseña y se muestra el resultado acá mismo. Antes, el problema
// era que el enlace de recuperación volvía a "localhost:3000" (el Site
// URL del proyecto) y la persona nunca alcanzaba esta pantalla.
// ------------------------------------------------------------------

const $=id=>document.getElementById(id);
const msg=$('msg');
const form=$('formPwd');
let listoParaGuardar=false;

function avisar(texto,tipo){
  msg.textContent=texto;
  msg.className='regMsg'+(tipo?' '+tipo:'');
}

document.querySelectorAll('[data-ver]').forEach(b=>{
  b.addEventListener('click',()=>{
    const input=b.parentNode.querySelector('input');
    const visible=input.type==='password';
    input.type=visible?'text':'password';
    b.textContent=visible?'Ocultar':'Ver';
  });
});

$('password').addEventListener('input',e=>{
  const v=e.target.value;
  let puntos=0;
  if(v.length>=8)puntos++;
  if(v.length>=12)puntos++;
  if(/[a-z]/.test(v)&&/[A-Z]/.test(v))puntos++;
  if(/[0-9]/.test(v))puntos++;
  if(/[^A-Za-z0-9]/.test(v))puntos++;
  const colores=['var(--danger)','var(--danger)','#e08b1a','#7aa63a','var(--accent)'];
  const textos=['Muy corta.','Débil.','Aceptable.','Buena.','Muy buena.'];
  const i=puntos?Math.min(puntos,5)-1:0;
  $('barra').style.width=(puntos?(puntos/5*100):(v?15:0))+'%';
  $('barra').style.background=(puntos||v)?(puntos?colores[i]:'var(--danger)'):'transparent';
  $('fuerzaTxt').textContent=v?textos[i]:'Mínimo 8 caracteres.';
});

// ------------------------------------------------------------------
// Al abrir: quedarse con la sesión de recuperación, o preguntar.
// ------------------------------------------------------------------
async function iniciar(){
  // Flujo nuevo: ?code=... Se cambia por una sesión en un solo paso.
  try{
    const {data,error}=await window.supabaseClient.auth.getSession();
    if(!error&&data.session){
      listoParaGuardar=true;
      form.style.display='';
      $('titulo').textContent='Cambia tu contraseña';
      $('bajada').textContent='Escribe la nueva contraseña y listo.';
      $('password').focus();
      return;
    }
  }catch(error){}

  // Sin sesión: el enlace llegó incompleto o la persona abrió la
  // página a mano. Se le explica qué hacer en vez de mostrar un
  // formulario que no iba a funcionar.
  form.style.display='none';
  $('titulo').textContent='Falta el enlace';
  $('bajada').textContent='Para cambiar la contraseña hay que entrar con el enlace que se envió al correo.';
  avisar('Si llegaste hasta acá escribiendo la dirección a mano, no se puede cambiar la contraseña: '+
    'hace falta el enlace. Pídele a quien administra el sistema que te lo reenvíe, o entra a '+
    '<a href="login.html">iniciar sesión</a> y usa "Olvidé mi contraseña".','warn');
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!listoParaGuardar){
    avisar('Este formulario necesita el enlace que se envió al correo. Vuelve a pedirlo.','err');
    return;
  }
  const p1=$('password').value;
  const p2=$('password2').value;
  if(p1.length<8){avisar('La contraseña necesita al menos 8 caracteres.','err');return;}
  if(p1!==p2){avisar('Las dos contraseñas no son iguales.','err');return;}

  $('btnGuardar').disabled=true;
  $('btnGuardar').textContent='Guardando…';
  try{
    const {error}=await window.supabaseClient.auth.updateUser({password:p1});
    if(error){
      // La causa más común: el enlace se usó una vez y expiró.
      if(/Auth session missing|invalid|expired/i.test(error.message)){
        avisar('El enlace ya no sirve: se usa una sola vez y tiene fecha de vencimiento. '+
          'Pide uno nuevo desde "Olvidé mi contraseña".','err');
      }else{
        avisar('No se pudo cambiar la contraseña: '+error.message,'err');
      }
      $('btnGuardar').disabled=false;
      $('btnGuardar').textContent='Guardar contraseña';
      return;
    }
    // Se cierra la sesión de recuperación: si se dejara abierta, al
    // entrar después se usaría un token vencido en vez de la contraseña.
    await window.supabaseClient.auth.signOut();
    form.style.display='none';
    $('titulo').textContent='Contraseña cambiada';
    $('bajada').textContent='Ya puedes entrar con la nueva.';
    avisar('Listo. Entra con tu correo y la contraseña que acabas de poner.','ok');
    $('msg').insertAdjacentHTML('beforeend',
      ' <a href="login.html" style="color:inherit;text-decoration:underline">Ir a iniciar sesión</a>');
  }catch(error){
    avisar('No se pudo cambiar la contraseña: '+((error&&error.message)||error),'err');
    $('btnGuardar').disabled=false;
    $('btnGuardar').textContent='Guardar contraseña';
  }
});

iniciar();
</script>
</body>
</html>
